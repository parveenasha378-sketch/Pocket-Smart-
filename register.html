{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}<div class="auth card"><h1>Create account</h1><form id="f"><label>Username<input name="username" minlength="3" required></label><label>Password<input name="password" type="password" minlength="6" required></label><button class="btn">Register</button><p id="m"></p></form></div>{% endblock %}{% block scripts %}<script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();m.textContent=d.message||d.detail;if(r.ok)setTimeout(()=>location='/login',700)}</script>{% endblock %}
