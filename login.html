{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}<div class="auth card"><h1>Login</h1><form id="f"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><button class="btn">Login</button><p id="m"></p></form></div>{% endblock %}{% block scripts %}<script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();m.textContent=d.message||d.detail;if(r.ok)location='/dashboard'}</script>{% endblock %}
